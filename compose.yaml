# Nesting1D - 開発コンテナ構成
# 役割: 開発用サービス、ワークスペースマウント、ポート、Codex用ボリュームを定義する。
# 更新日: 2026-08-10

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: nesting1d-dev

    working_dir: /workspace/nesting1d

    user: developer

    volumes:
      - .:/workspace/nesting1d
      - codex-data:/home/developer/.codex

    ports:
      - "8000:8000"

    command: sleep infinity

volumes:
  codex-data:
    name: nesting1d-codex-data
